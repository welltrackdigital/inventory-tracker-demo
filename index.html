:root{
  --mid:#1B0E20;--violet:#44334A;--lav:#C4ADDD;--pale:#D1C0EC;
  --bg:#F6F0FA;--bg2:#EBE1F3;--panel:#FFFFFF;--card:#FFFFFF;--card2:#FAF6FC;--card3:#E6DAF0;
  --line:rgba(27,14,32,.12);--line2:rgba(27,14,32,.07);
  --ink:#1B0E20;--ink2:#2E1E35;--muted:#6B5775;--faint:#8D77A8;
  --accent:#44334A;--accent2:#2F2235;--btn:#44334A;--btn2:#33263A;--onbtn:#fff;
  --good:#13845A;--warn:#A86400;--bad:#C23A51;
  --shadow:0 18px 40px rgba(27,14,32,.12);--shadow2:0 4px 14px rgba(27,14,32,.06);
  --glow:0 0 0 1px rgba(68,51,74,.25),0 10px 26px rgba(68,51,74,.18);
  --r:18px;--r2:13px;--r3:10px;
  --serif:"Fraunces","Iowan Old Style",Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

}
html[data-theme="dark"]{
  --bg:#130A17;--bg2:#1B0E20;--panel:#231528;--card:#281A2E;--card2:#33223A;--card3:#44334A;
  --line:rgba(196,173,221,.18);--line2:rgba(196,173,221,.1);
  --ink:#F4ECFA;--ink2:#D1C0EC;--muted:#B8A5CB;--faint:#8D77A8;
  --accent:#C4ADDD;--accent2:#E3D6F2;--btn:#75608F;--btn2:#8D77A8;--onbtn:#fff;
  --good:#4CC38A;--warn:#E9B24C;--bad:#F07C8C;

  --glow:0 0 0 1px rgba(196,173,221,.35),0 10px 30px rgba(68,51,74,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;font-size:14.5px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 600px at 90% 0%,rgba(196,173,221,.28),transparent 60%),radial-gradient(700px 500px at -10% 100%,rgba(209,192,236,.9),transparent 60%)}
html[data-theme="dark"] body::before{background:radial-gradient(900px 600px at 90% 0%,rgba(68,51,74,.35),transparent 60%),radial-gradient(700px 500px at -10% 100%,rgba(68,51,74,.25),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--accent)}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
svg{display:block}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::selection{background:rgba(196,173,221,.5)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--card3);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
[hidden]{display:none!important}

/* ================= sidebar (midnight, starlight) ================= */
.app{position:relative;z-index:1;min-height:100vh;display:flex}
.side{width:284px;flex:0 0 284px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40;color:#D1C0EC;
  background:radial-gradient(rgba(209,192,236,.15) 1px,transparent 1.4px) 0 0/22px 22px,radial-gradient(rgba(209,192,236,.07) 1px,transparent 1.2px) 11px 11px/22px 22px,linear-gradient(180deg,#1B0E20 0%,#2A1B31 60%,#44334A 100%);box-shadow:8px 0 30px rgba(27,14,32,.18)}
.brand{display:flex;align-items:center;gap:11px;color:inherit;text-align:left;padding:18px 18px 14px;border-bottom:1px solid rgba(209,192,236,.1)}
.brand .mk{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#8D77A8,#44334A 55%,#2A1B31);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(0,0,0,.35)}
.brand .mk img{width:27px;height:auto;display:block}
.brand b{display:block;font-family:var(--serif);font-size:19px;line-height:1.05;font-weight:600;color:#fff}
.brand small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#C4ADDD;margin-top:4px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{flex:1;overflow-y:auto;padding:4px 12px 12px;scrollbar-width:thin;scrollbar-color:rgba(209,192,236,.2) transparent}
.nav .gl{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#9C85B5;padding:12px 0 5px 50px}
.nav .st{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:6px 10px;border-radius:14px;text-align:left;color:#D9C9EE;transition:background .15s}
.nav .st::before{content:"";position:absolute;left:23px;top:-12px;bottom:-12px;width:2px;background:rgba(209,192,236,.13);pointer-events:none}
.nav .st:first-of-type::before{top:50%}.nav .st:last-of-type::before{bottom:50%}
.nav .st.set .n{background:transparent;border-style:dashed}.nav .st.set.on .n{background:#D1C0EC;border-style:solid}.nav .st.set .tx b .ic{display:none}
.nav .st .n{position:relative;z-index:1;width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#D1C0EC;background:#2A1B31;border:1.5px solid rgba(209,192,236,.32);transition:all .2s}
.nav .st .n .ic{width:14px;height:14px;stroke-width:3}
.nav .st .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.nav .st .tx b{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .st .tx b .ic{width:15px;height:15px;opacity:.65}
.nav .st .tx small{font-size:11.5px;color:#B9A6CC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.nav .st:hover{background:rgba(209,192,236,.07)}
.nav .st.done .n{background:#1baf7a;border-color:#1baf7a;color:#fff}
.nav .st.on{background:linear-gradient(90deg,rgba(209,192,236,.17),rgba(209,192,236,.05));box-shadow:inset 3px 0 0 #D1C0EC}
.nav .st.on .n{background:#D1C0EC;border-color:#D1C0EC;color:#1B0E20;box-shadow:0 0 0 5px rgba(209,192,236,.14),0 0 18px rgba(196,173,221,.6)}
.nav .st.on .tx small{color:#D9C9EE}
.nav .bd{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#C4ADDD;color:#1B0E20;font-size:11px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.nav .bd.warn{background:#E9B24C}.nav .bd.bad{background:#F07C8C}
.sbox{margin:0 14px 10px;padding:11px 12px;border-radius:14px;background:rgba(209,192,236,.07);border:1px solid rgba(209,192,236,.12);font-size:13px;color:#D1C0EC}
.sbox b{color:#fff;font-family:var(--serif);font-size:16px}.sbox .sub{color:#B9A6CC}
.sbox .btn{background:#D1C0EC;color:#1B0E20}
.hbar{display:flex;gap:2px;height:7px;border-radius:7px;overflow:hidden;margin:8px 0 6px;background:rgba(209,192,236,.1)}
.hbar i{display:block;height:100%}
.sfoot{display:flex;gap:6px;padding:10px 14px 16px;border-top:1px solid rgba(209,192,236,.1)}
.sfoot button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 10px;border-radius:11px;font-size:12.5px;font-weight:600;color:#D9C9EE;background:rgba(209,192,236,.07)}
.sfoot button:hover,.sfoot button.on{background:rgba(209,192,236,.16);color:#fff}
.sfoot .ic{width:16px;height:16px}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:11px 26px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line2)}
.top .burger{display:none}
.crumb{display:flex;align-items:center;gap:9px;flex:0 0 auto;min-width:0}
.crumb .cn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:#fff;font-weight:700;font-size:13px;flex:0 0 30px}
.crumb .cn .ic{width:16px;height:16px}
.crumb small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.crumb b{display:none;font-family:var(--serif);font-size:16px;line-height:1.1}
.srch{position:relative;flex:1;max-width:460px;margin:0 auto}
.srch>.ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.srch input[type=search]{width:100%;padding:10px 14px 10px 40px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);outline:0}
.srch input[type=search]::placeholder{color:var(--faint)}
.srch input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(68,51,74,.14)}
.srch .res{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:420px;overflow:auto;display:none;z-index:60;padding:6px}
.srch .res.open{display:block}
.srch .res button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:7px 9px;border-radius:10px}
.srch .res button:hover,.srch .res button.hl{background:var(--card2)}
.srch .res .tb{flex:1;min-width:0}.srch .res b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.srch .res small{font-size:11.5px;color:var(--muted)}
.srch .none{padding:10px;font-size:13px;color:var(--muted)}
.qtyp{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.qtyp.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}.qtyp.low{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.qtyp.out{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.hacts{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.curp{position:relative;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 8px 0 5px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--ink2);font-weight:600;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s;flex:0 0 auto}
.curp:hover{background:var(--card2)}.curp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(68,51,74,.14)}
.curp .cs{min-width:26px;height:26px;padding:0 5px;border-radius:8px;display:grid;place-items:center;background:var(--btn);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.curp .chev{width:14px;height:14px;color:var(--muted)}
.curp select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;font-size:16px}
.bnav{display:none}
.show-sm{display:none}
/* the 1-2-3 guide on every page */
.guide{margin-bottom:18px;padding:14px 16px 16px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(115deg,color-mix(in srgb,var(--lav) 30%,var(--card)),var(--card) 70%)}
html[data-theme="dark"] .guide{background:linear-gradient(115deg,#3A2A42,var(--card) 70%)}
.guide .gh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.guide .gk{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.guide .gk .ic{width:16px;height:16px}
.gs3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gs3>div{position:relative;padding:12px 34px 12px 54px;border-radius:14px;background:var(--card);border:1px solid var(--line2);box-shadow:var(--shadow2)}
.gs3>div:not(:last-child)::after{content:"";position:absolute;right:-11px;top:50%;width:8px;height:8px;border-top:2px solid var(--lav);border-right:2px solid var(--lav);transform:translateY(-50%) rotate(45deg);z-index:1}
.gs3 .gn{position:absolute;left:12px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:#fff;font-weight:700;font-size:13px}
.gs3 .gi{position:absolute;right:10px;top:11px;color:var(--accent);opacity:.55}
.gs3 .gi .ic{width:18px;height:18px}
.gs3 b{display:block;font-size:13.5px;line-height:1.3}
.gs3 small{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.view{position:relative;padding:22px 26px 80px;max-width:1320px;width:100%;margin:0 auto;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.phead h1{font-size:30px;line-height:1.1;margin-top:3px}
.phead p{color:var(--muted);font-size:13.5px;margin-top:4px;max-width:720px}
.phead .pa{display:flex;gap:8px;flex-wrap:wrap}
.next{display:flex;align-items:center;gap:12px;margin-top:28px;padding:14px 16px;border-radius:16px;border:1px dashed var(--line);flex-wrap:wrap}
.next .nn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:#fff;font-size:11.5px;font-weight:700}
.next>span:first-child{display:flex;align-items:center;gap:7px}

/* ================= generic ================= */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow2);min-width:0;position:relative}
.card h3,.ch h3{font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .ic{color:var(--accent)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.kick{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;border-radius:12px;background:var(--btn);color:var(--onbtn);font-weight:600;font-size:13.5px;border:1px solid transparent;transition:background .15s,transform .1s,box-shadow .15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--btn2);box-shadow:0 6px 16px rgba(68,51,74,.3)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--card2);box-shadow:none}
.btn.soft{background:var(--card2);color:var(--ink);border-color:var(--line)}
.btn.soft:hover{background:var(--card3);box-shadow:none}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 10%,transparent);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn .ic{width:16px;height:16px}
label.btn{cursor:pointer}
.icb{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink2);flex:0 0 36px;transition:background .15s,transform .1s}
.icb:hover{background:var(--card2)}.icb:active{transform:scale(.95)}.icb:disabled{opacity:.35;pointer-events:none}
.icb.sm{width:30px;height:30px;flex:0 0 30px;border-radius:9px}.icb.sm .ic{width:15px;height:15px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row.nw{flex-wrap:nowrap}
.sp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--ink2);transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.chip b{font-weight:700;opacity:.8}
.chip .ic{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--card3);color:var(--ink2);white-space:nowrap}
.pill .ic{width:13px;height:13px}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.warnp{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.kind{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.pill.st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.st.ok{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good)}
.pill.st.low{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.st.out{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.goodt{color:var(--good)}.badt{color:var(--bad)}.warnt{color:var(--warn)}
.goodt .ic,.badt .ic{display:inline-block;vertical-align:-3px;width:16px;height:16px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);outline:0;transition:border-color .15s,box-shadow .15s;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(68,51,74,.14)}
input[readonly]{opacity:.7}
textarea{resize:vertical;min-height:70px;line-height:1.5}
select{max-width:100%}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fld{margin-bottom:12px;min-width:0}
input[type=checkbox]{accent-color:var(--violet);width:17px;height:17px;flex:0 0 17px}
.cur{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:0 10px;transition:border-color .15s,box-shadow .15s;min-width:0}
.cur:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(68,51,74,.14)}
.cur span{color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.cur input{border:0!important;background:transparent!important;box-shadow:none!important;padding:10px 6px!important;min-width:0}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .eic{width:68px;height:68px;margin:0 auto 12px;border-radius:22px;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 30% 25%,#8D77A8,#44334A 55%,#1B0E20);box-shadow:0 12px 24px rgba(68,51,74,.3)}
.empty .eic .ic{width:30px;height:30px}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:18px;margin-bottom:4px}
.empty>div{max-width:520px;margin:0 auto}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.kv:last-child{border-bottom:0}.kv.tot{border-top:2px solid var(--line);margin-top:4px;padding-top:10px}
.tip{font-size:12.5px;color:var(--muted);background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:9px;align-items:flex-start}
.tip .ic{color:var(--accent);margin-top:1px}
.note{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;border-radius:12px;padding:9px 11px;background:var(--card2);border:1px solid var(--line)}
.note.warn{background:color-mix(in srgb,var(--warn) 10%,var(--card));border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.note .ic{color:var(--warn);margin-top:1px}
.okmsg{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--good) 9%,var(--card));color:var(--ink2);font-size:13.5px}
.okmsg .ic{color:var(--good);width:20px;height:20px}
.okmsg.big{padding:18px}
.hr{height:1px;background:var(--line2);margin:14px 0}
.mt{margin-top:16px}.mt8{margin-top:8px}.mb{margin-bottom:16px}
.bar{height:7px;border-radius:7px;background:var(--card3);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--violet),var(--lav));transition:width .6s}
.kb{font:600 11px var(--sans);padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:var(--card2)}
.list{display:flex;flex-direction:column;gap:7px}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:15px;width:max-content;max-width:100%}
.subs button{padding:8px 15px;border-radius:11px;font-size:13.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.subs button:hover{color:var(--ink);background:var(--card2)}
.subs button.on{background:var(--btn);color:#fff;box-shadow:0 4px 12px rgba(68,51,74,.3)}
.subs .bd{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:10px;background:rgba(255,255,255,.2)}
.subs button:not(.on) .bd{background:var(--card3);color:var(--ink2)}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{padding:7px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px;color:var(--ink2)}
.seg button .ic{width:15px;height:15px}
.seg button.on{background:var(--btn);border-color:var(--btn);color:#fff}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tools select{width:auto;min-width:150px;padding:8px 10px}
.srch2{position:relative;flex:1 1 260px;max-width:380px}
.srch2 .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.srch2 input[type=search]{padding:9px 12px 9px 36px;background:var(--card)}
.vt{display:flex;padding:3px;border-radius:11px;background:var(--card);border:1px solid var(--line)}
.vt button{width:32px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.vt button.on{background:var(--btn);color:#fff}
.vt .ic{width:16px;height:16px}
.sumbar{display:flex;gap:8px;flex-wrap:wrap}
.sumbar span{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:8px 14px;display:flex;flex-direction:column;min-width:120px}
.sumbar small{font-size:11px;color:var(--muted)}.sumbar b{font-family:var(--serif);font-size:19px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;margin-bottom:16px;background:linear-gradient(100deg,color-mix(in srgb,var(--lav) 40%,var(--card)),var(--card));border:1px solid var(--line);font-size:13px}
.banner>.ic{color:var(--accent);width:22px;height:22px}.banner>span{flex:1}

/* thumbnails */
.th{display:grid;place-items:center;flex:0 0 auto;border-radius:30%;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 72%,#fff),var(--c));box-shadow:0 4px 10px color-mix(in srgb,var(--c) 30%,transparent);overflow:hidden}
.th .ic{width:55%;height:55%}
.th.ph{background:#fff;box-shadow:0 0 0 1px var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}

/* ================= dashboard ================= */
.sphere{position:relative;border-radius:var(--r);overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(196,173,221,.35),transparent 65%),linear-gradient(165deg,#FFFFFF,#EFE6F6);border:1px solid var(--line);box-shadow:var(--shadow);min-height:420px}
html[data-theme="dark"] .sphere{background:radial-gradient(circle at 50% 40%,rgba(68,51,74,.45),transparent 65%),linear-gradient(165deg,#2D1D34,#1B0E20)}
.sphere canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:pan-y}
.sphere canvas:active{cursor:grabbing}
.sphere .ov{position:absolute;left:18px;top:16px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:10px}
.sphere .ov h3{font-size:20px}
.sphere .ov .sub{max-width:330px}
.sphere .ovr{pointer-events:auto}
.sphere .ovr .seg button{background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(6px)}
.sphere .ovr .seg button.on{background:var(--btn)}
.sphere .lg{position:absolute;left:16px;bottom:13px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);pointer-events:none}
.sphere .lg span{display:flex;align-items:center;gap:6px}.sphere .lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sphere .hint{position:absolute;right:16px;bottom:13px;font-size:11px;color:var(--faint);pointer-events:none}
.sphere .tipbox{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 11px;border-radius:11px;font-size:12.5px;max-width:250px;box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:3}
.sphere .tipbox.on{opacity:1;transform:none}
.sphere .tipbox b{display:block}.sphere .tipbox small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.valc .bigv,.bigv{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.1;margin:4px 0 8px;overflow-wrap:anywhere}
.hrow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;font-size:13px;background:var(--card2);text-align:left;width:100%}
.hrow:hover{background:var(--card3)}.hrow b{margin-left:auto}
.ring{position:relative;display:grid;place-items:center;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring .rc{position:absolute;text-align:center;line-height:1.1}
.ring .rc b{display:block;font-family:var(--serif)}
.ring .rc small{font-size:10.5px;color:var(--muted)}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);text-align:left;transition:transform .15s,border-color .15s,background .15s}
.qa button:hover{transform:translateY(-2px);border-color:var(--accent);background:var(--card)}
.qa button .ic{width:22px;height:22px;color:var(--accent);margin-bottom:4px}
.qa b{font-size:13.5px}.qa small{font-size:11.5px;color:var(--muted)}
.qa.big{grid-template-columns:repeat(5,minmax(0,1fr))}
.qa.big button{background:var(--card);box-shadow:var(--shadow2)}
.stat{display:flex;gap:13px;align-items:center;text-align:left;cursor:pointer;transition:transform .15s,border-color .15s}
.stat:hover{transform:translateY(-2px);border-color:var(--accent)}
.stat .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card3);color:var(--accent);flex:0 0 44px}
.stat .si .ic{width:21px;height:21px}
.stat .v{display:block;font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.05}
.stat .l{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.warnc{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.warnc .si{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.arow,.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);min-width:0}
.arow .tb,.mrow .tb{flex:1;min-width:0}
.arow b,.mrow b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow small,.mrow small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:0 0 32px;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.mic.p{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good)}
.mic .ic{width:16px;height:16px}
.mq{font-family:var(--serif);font-weight:600;font-size:16px;white-space:nowrap}.mq.p{color:var(--good)}.mq.n{color:var(--bad)}
.dh{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 2px 2px}
.dh:first-child{margin-top:0}
.cm{display:flex;flex-direction:column;align-items:center;font-family:var(--serif);font-size:20px;font-weight:600;line-height:1;min-width:58px}
.cm small{font-family:var(--sans);font-size:10px;color:var(--muted);font-weight:500;margin-top:2px}.cm.z{color:var(--bad)}
.rk{width:22px;height:22px;border-radius:7px;background:var(--card3);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 22px}
.gs .gsl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gs .gsl button{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);font-size:13px;text-align:left}
.gs .gsl button:hover{border-color:var(--accent)}
.gs .gsl .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--accent);display:grid;place-items:center;color:transparent;flex:0 0 22px}
.gs .gsl .ck .ic{width:13px;height:13px;stroke-width:3}
.gs .gsl button.d{color:var(--muted)}.gs .gsl button.d .ck{background:var(--good);border-color:var(--good);color:#fff}
.hero{padding:26px}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0}
.flow>div{position:relative;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);display:flex;flex-direction:column;gap:3px}
.flow .n{width:22px;height:22px;border-radius:50%;background:var(--btn);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.flow .ic{position:absolute;right:10px;top:12px;color:var(--accent);width:17px;height:17px}
.flow b{font-size:13.5px;margin-top:4px}.flow small{font-size:11.5px;color:var(--muted);line-height:1.35}
.flow.mini{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.flow.mini>div{flex-direction:row;align-items:center;gap:7px;padding:7px 9px}
.flow.mini b{margin:0;font-size:12.5px}
.defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.defs div{padding:10px 12px;border-radius:12px;background:var(--card2);font-size:12.5px;color:var(--muted)}
.defs b{display:block;color:var(--ink);font-size:13.5px}

/* ================= item cards & tables ================= */
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.icard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow2);padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.icard::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--c)}
.icard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.icard.out{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.icard.low{border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.ihead{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-width:0}
.ihead .tb{flex:1;min-width:0}.ihead b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ihead small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.qrow .big{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1}.qrow .u{font-size:12px;color:var(--muted);margin-left:6px}
.icard .bar{margin-top:0}
.facts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.facts3 span{background:var(--card2);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.facts3 small{font-size:10.5px;color:var(--muted)}.facts3 b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iacts{display:flex;align-items:center;gap:6px}
.iacts .loc{display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}.iacts .loc .ic{width:13px;height:13px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.facts span{background:var(--card2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.facts small{font-size:10.5px;color:var(--muted)}
.q{display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;background:var(--card3);color:var(--muted);font-size:9px;font-style:normal;font-weight:700;vertical-align:1px;cursor:help}
[data-tip]{cursor:help}button[data-tip],.chart [data-tip]{cursor:pointer}.facts b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--card)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:200px}
.tbl .r{text-align:right}
.tbl tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.tbl tr.bad td{background:color-mix(in srgb,var(--bad) 7%,transparent)}
.tbl tr.opn td{background:color-mix(in srgb,var(--warn) 6%,transparent)}
.tblwrap{overflow:auto;max-height:560px;border:1px solid var(--line2);border-radius:12px}
.tbl.sch th{position:sticky;top:0;z-index:1}
.tbl input,.tbl .cur input{padding:7px 9px}
.tbl.chs td{padding:6px 8px}.tbl.chs input[type=text]{min-width:70px}.tbl.chs input[data-f=n]{min-width:150px}
.tlink{display:flex;align-items:center;gap:8px;text-align:left;font-weight:600;color:var(--ink);max-width:340px}
.tlink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlink:hover span{text-decoration:underline}
.abc{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-weight:700;font-size:12px;color:#fff}
.abc.A{background:var(--good)}.abc.B{background:#2a78d6}.abc.C{background:var(--faint)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi small{font-size:12px;color:var(--muted)}.kpi b{font-family:var(--serif);font-size:27px;line-height:1.15}.kpi span{font-size:12px;color:var(--muted)}

/* ================= lots, refunds, Etsy ================= */
.pill.exp{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.expc{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.lotbox{margin:4px 0 12px;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px dashed var(--line)}
.lotbox b{display:block;font-size:13.5px}.lotbox small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.lotin{display:flex;gap:10px;align-items:flex-start;padding:10px 12px 0;border-radius:12px;background:color-mix(in srgb,var(--lav) 18%,var(--card));margin-bottom:10px}
.lotin>.ic{margin-top:30px;color:var(--accent)}
.tbl tr.lotrow td{background:var(--card2);padding-top:4px}
.tbl tr.lotrow input{padding:6px 9px}
.rbox{margin:6px 0 4px;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line2)}
.rbox>.row b{display:flex;align-items:center;gap:7px;font-size:13.5px}.rbox>.row b .ic{color:var(--accent)}
.opt2{display:flex;flex-direction:column;gap:6px}
.opt2>b{display:flex;align-items:center;gap:8px;font-size:15px}.opt2>b .ic{color:var(--accent)}
.howto{margin:4px 0 10px 18px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.howto b{color:var(--ink);font-weight:600}
.trace{display:flex;flex-direction:column;gap:6px;position:relative}
.trace .tr{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:12px;background:var(--card2)}
.trace .tr .tb{flex:1;min-width:0}.trace .tr b{display:block;font-size:13px}.trace .tr small{display:block;font-size:11.5px;color:var(--muted)}
.trace .chip{padding:1px 8px;font-size:11px}
.vs .hlb{background:color-mix(in srgb,var(--bad) 12%,var(--card))}
/* ================= modals: lines, previews ================= */
.mdl{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(27,14,32,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.mdl .box{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px;animation:pop .25s cubic-bezier(.2,.8,.2,1);outline:0}
.mdl .box.w{width:min(800px,100%)}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.mdl .mh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px}
.mdl .mt1{display:flex;gap:12px;align-items:center;min-width:0}
.mdl .mi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--card3);color:var(--accent);flex:0 0 40px}
.mdl .mh h2{font-size:21px;line-height:1.15}.mdl .mh small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.mdl .mf{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.preview{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--card2);font-size:13px;color:var(--muted)}
.preview b{color:var(--ink)}.preview .ic{width:15px;height:15px}
.preview:empty{display:none}
.lines{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.lh,.line{display:grid;grid-template-columns:minmax(0,1fr) 80px 130px 90px 30px;gap:8px;align-items:center}
.lh{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.line .lt{font-weight:600;text-align:right;font-size:13px}
.line .lw{grid-column:1/-1;margin-top:-3px;font-size:11.5px}
.line .lw .ic{display:inline-block;width:14px;height:14px;vertical-align:-3px;margin-right:3px}
.line input.lq{text-align:center;padding:10px 6px}
.sumup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:6px}
.sumup div{background:var(--card2);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;min-width:0}
.sumup small{font-size:10.5px;color:var(--muted)}.sumup b{font-size:14.5px;white-space:nowrap}
.sumup .pf{background:color-mix(in srgb,var(--good) 13%,var(--card));}.sumup .pf b{font-family:var(--serif);font-size:19px;color:var(--good)}.sumup .pf span{font-size:11px;color:var(--muted)}
.sumup .pf.neg{background:color-mix(in srgb,var(--bad) 12%,var(--card))}.sumup .pf.neg b{color:var(--bad)}
.ipanel .bcwrap{max-width:320px;padding:8px;background:#fff;border-radius:10px;border:1px solid var(--line)}
.bc{display:block;max-width:100%}
.bcw{display:flex;flex-direction:column;align-items:center;width:100%;background:#fff}.bcw small{font:11px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#000;letter-spacing:.04em;margin-top:2px}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover}
.cam i{position:absolute;left:12%;right:12%;top:45%;height:2px;background:#F07C8C;box-shadow:0 0 12px #F07C8C}
.lpick{display:flex;flex-direction:column;gap:4px;max-height:330px;overflow:auto;border:1px solid var(--line2);border-radius:12px;padding:6px}
.lpick label{gap:10px;padding:6px 8px;border-radius:10px;cursor:pointer}.lpick label:hover{background:var(--card2)}
.lpick .tb{flex:1;min-width:0;font-size:13.5px;font-weight:500}.lpick small{display:block;color:var(--muted);font-size:11.5px}
.welcome .wl{width:92px;height:92px;border-radius:24px;margin:2px auto 14px;display:block;box-shadow:0 12px 28px rgba(27,14,32,.3)}

/* ================= recipes ================= */
.rgrid{grid-template-columns:minmax(260px,320px) minmax(0,1fr)}
.rlist{align-self:start;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
.rpick{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-align:left;width:100%;border:1px solid transparent}
.rpick:hover{background:var(--card2)}
.rpick.on{background:color-mix(in srgb,var(--accent) 10%,var(--card));border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.rpick .tb{flex:1;min-width:0}.rpick b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rpick small{display:block;font-size:11.5px;color:var(--muted)}
.bom{display:flex;flex-direction:column;gap:8px}
.bh,.brow2{display:grid;grid-template-columns:minmax(0,1fr) 140px 90px 100px 30px;gap:8px;align-items:center}
.bh{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brow2 .cur span{font-weight:500;font-size:12px}
.cost .bigv{font-size:28px}

/* ================= stock count ================= */
.cbar{position:sticky;top:72px;z-index:5}
.cbar .tb b,.cbar .tb small{display:block}
.scanbox{max-width:520px}
.clist{display:flex;flex-direction:column;gap:7px}
.crow{display:grid;grid-template-columns:36px minmax(0,1fr) 110px 170px 92px;gap:12px;align-items:center;padding:9px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow2)}
.crow .tb{min-width:0}.crow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crow small{display:block;font-size:11.5px;color:var(--muted)}
.crow .exp b{font-size:14px}
.crow .cin{display:flex;gap:5px;align-items:center}.crow .cin input{text-align:center;padding:8px 4px}
.crow .dif{text-align:right}
.crow.ok{border-color:color-mix(in srgb,var(--good) 40%,var(--line));background:color-mix(in srgb,var(--good) 5%,var(--card))}
.crow.df{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 5%,var(--card))}
.crow.flash{animation:flash 1s ease}

/* ================= reorder / suppliers ================= */
.card.po.received{opacity:.8}
.card.po .tb small{display:block}

/* ================= pricing ================= */
.pbreak{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:6px}
.pbreak div{background:var(--card2);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column}

.pricebox{background:linear-gradient(150deg,color-mix(in srgb,var(--lav) 45%,var(--card)),var(--card))}

/* ================= charts ================= */

.chart svg{width:100%;height:auto;overflow:visible}

.chart .gl{stroke:var(--line2);stroke-width:1}.chart .ax{stroke:var(--line);stroke-width:1}
